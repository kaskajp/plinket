name: Test feedback relay

on:
  pull_request:
    paths: ["feedback-relay/**", ".github/workflows/feedback-relay.yml"]
  push:
    branches: [main]
    paths: ["feedback-relay/**", ".github/workflows/feedback-relay.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test feedback-relay/*.test.mjs
